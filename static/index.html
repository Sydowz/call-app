<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Friends Call</title>
</head>
<body style="font-family: system-ui, sans-serif; background: #0B0C10; color: #E8EAF2">
  <p>Criando sala…</p>
  <noscript>Este app precisa de JavaScript.</noscript>
  <script>
    const bytes = crypto.getRandomValues(new Uint8Array(8));
    const id = Array.from(bytes, (b) => b.toString(16).padStart(2, '0')).join('');
    location.replace('/room/' + id);
  </script>
</body>
</html>
