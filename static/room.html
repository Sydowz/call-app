<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Friends Call</title>
  <style>
    :root {
      --bg: #0B0C10;
      --card: #13151C;
      --raised: #1F2230;
      --frame: #1A1D27;
      --border: #232734;
      --border-strong: #2A2E3D;
      --text: #E8EAF2;
      --muted: #8A90A6;
      --faint: #5A6078;
      --accent: #7C5CFF;
      --online: #3BD98A;
      --live: #F58C8C;
      --live-bg: #3A1F25;
      --warn: #F2B267;
      --danger: #FF8A95;
      --danger-bg: #4A1F27;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 Inter, system-ui, sans-serif; }
    button, input { font: inherit; color: inherit; }
    button { border: 0; cursor: pointer; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    [hidden] { display: none !important; }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; }
    .eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .muted { color: var(--muted); }
    .online { color: var(--online); }
    .live { color: var(--live); }
    .warn { color: var(--warn); }
    .ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .end { margin-left: auto; font-size: 12px; white-space: nowrap; }
    .avatar { flex: none; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; background: #2E3A5C center / cover no-repeat; user-select: none; }
    .pill { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--raised); white-space: nowrap; }
    .btn { display: inline-flex; align-items: center; justify-content: center; height: 44px; padding: 0 18px; border-radius: 12px; background: var(--raised); color: var(--text); text-decoration: none; white-space: nowrap; }
    .btn.small { height: 36px; border-radius: 10px; font-weight: 600; }
    .btn.primary { background: var(--accent); color: #fff; font-weight: 600; }
    .btn.danger { background: var(--danger-bg); color: var(--danger); font-weight: 600; }
    .short { display: none; }

    /* ---------- layout ---------- */
    .app { height: 100vh; height: 100dvh; padding: 12px; display: flex; gap: 12px; }

    .logo { flex: none; width: 32px; height: 32px; border-radius: 10px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; user-select: none; }

    .side { width: 280px; flex: none; display: flex; flex-direction: column; gap: 12px; }
    .room { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .room h1 { margin: 0; font-size: 16px; font-weight: 600; }
    #people { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; max-height: 240px; overflow-y: auto; }
    .chat { flex: 1; min-height: 0; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    #chat-close { display: none; }
    #messages { flex: 1; min-height: 0; overflow-y: auto; list-style: none; margin: 0; padding: 0 4px 0 0; display: flex; flex-direction: column; }
    .msg { padding-top: 10px; }
    .msg.grouped { padding-top: 2px; }
    .msg-head { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; min-width: 0; }
    .msg-head .avatar { width: 24px; height: 24px; font-size: 10px; }
    .msg-head strong { font-size: 13px; font-weight: 600; }
    .msg-head time { flex: none; font-size: 11px; color: var(--muted); }
    .msg-text { margin: 0; padding-left: 32px; overflow-wrap: anywhere; white-space: pre-wrap; }
    .msg-text a { color: #B3A6FF; }
    .system { padding: 8px 0 2px; font-size: 12px; color: var(--muted); text-align: center; }
    .chat-form { display: flex; gap: 8px; }
    .chat-form input { flex: 1; min-width: 0; height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--raised); }
    .badge { min-width: 18px; height: 18px; margin-left: 6px; padding: 0 5px; border-radius: 9px; background: var(--live); color: var(--bg); font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
    #chat-toggle { display: none; }
    .me { margin-top: auto; padding: 12px; }
    .me .avatar { width: 40px; height: 40px; font-size: 13px; }
    .me-text { display: flex; flex-direction: column; min-width: 0; }
    .me-text strong { font-weight: 600; }
    .me-text span { font-size: 12px; }

    .stage { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
    .topbar { flex: none; height: 56px; padding: 0 16px; display: flex; align-items: center; gap: 12px; }
    .topbar h2 { margin: 0; font-size: 16px; font-weight: 600; }
    .topbar-end { margin-left: auto; display: flex; gap: 8px; }
    .topbar .pill { background: var(--live-bg); color: var(--live); }
    .topbar .pill.reconnecting { background: var(--raised); color: var(--warn); }

    .content { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 12px; }
    #screens { min-height: 0; display: grid; gap: 12px; grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); }
    .screen { min-height: 0; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .frame { flex: 1; min-height: 0; border-radius: 12px; background: var(--frame); border: 1px solid var(--border-strong); overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--faint); text-align: center; }
    .frame video { width: 100%; height: 100%; display: block; object-fit: contain; background: #000; touch-action: manipulation; /* no double-tap zoom */ }
    #empty .frame { padding: 24px; }
    #empty strong { color: var(--muted); font-weight: 600; }
    .screen-foot { display: flex; align-items: center; gap: 8px; font-size: 13px; min-width: 0; }
    .screen-foot .pill { color: var(--live); font-size: 13px; overflow: hidden; text-overflow: ellipsis; }
    .screen-foot .hint { margin-left: auto; }
    .screen-foot .btn { flex: none; }
    .waiting { padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; color: var(--muted); }
    .failed strong { color: var(--warn); font-weight: 600; }
    .failed span { max-width: 44ch; font-size: 13px; }

    #tiles { min-height: 0; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
    .tile { flex: 1; min-height: 120px; padding: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; }
    .tile.self { border: 2px solid var(--online); }
    .tile .avatar { width: 64px; height: 64px; font-size: 18px; }
    .tile strong { font-weight: 600; max-width: 100%; }
    .tile .status { font-size: 12px; }
    .tile > * { flex-shrink: 0; } /* never squash the name away */
    .tile-text { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; max-width: 100%; }
    @media (min-width: 761px) {
      /* Many people: avatar beside the name, so every card stays readable. */
      #tiles.compact .tile { flex: none; min-height: 0; flex-direction: row; justify-content: flex-start; gap: 12px; padding: 10px 12px; text-align: left; }
      #tiles.compact .tile .avatar { width: 40px; height: 40px; font-size: 13px; }
      #tiles.compact .tile-text { flex: 1 1 auto; align-items: flex-start; }
    }

    .controls { flex: none; height: 72px; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .mode { display: inline-flex; height: 44px; padding: 4px; gap: 4px; border-radius: 12px; background: var(--raised); }
    .mode-btn { padding: 0 14px; border-radius: 9px; background: transparent; color: var(--muted); }
    .mode-btn[aria-pressed="true"] { background: var(--card); color: var(--text); font-weight: 600; box-shadow: inset 0 0 0 1px var(--border-strong); }

    /* ---------- dialogs ---------- */
    dialog { width: min(360px, calc(100vw - 32px)); padding: 0; border: 1px solid var(--border); border-radius: 20px; background: var(--card); color: var(--text); overflow: hidden; }
    dialog:focus-visible { outline: none; }
    dialog::backdrop { background: rgb(11 12 16 / .85); }
    .banner { height: 72px; background: var(--raised); }
    .dialog-body { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .banner + .dialog-body { padding-top: 0; }
    .avatar-row { margin-top: -36px; display: flex; align-items: flex-end; gap: 8px; }
    .avatar-row .avatar { margin-right: auto; }
    .avatar.big { width: 76px; height: 76px; font-size: 24px; font-weight: 700; border: 4px solid var(--card); }
    dialog h2 { margin: 0; font-size: 20px; font-weight: 700; }
    dialog p { margin: 0; }
    .heading { display: flex; flex-direction: column; gap: 2px; }
    .heading span { font-size: 13px; }
    .field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
    .field input { height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--raised); font-size: 14px; }
    .actions { display: flex; gap: 8px; }
    .actions .btn { flex: 1; }

    .toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); padding: 8px 14px; border-radius: 999px; background: var(--raised); border: 1px solid var(--border-strong); font-size: 13px; }

    /* ---------- mobile ---------- */
    @media (max-width: 760px) {
      .side, .screen-foot .hint, .tile .status, .mode { display: none; }
      .long { display: none; }
      .short { display: inline; }
      .topbar { height: 52px; padding: 0 14px; gap: 10px; }
      .topbar h2 { font-size: 15px; }
      .topbar .pill { font-size: 11px; padding: 3px 8px; }
      .content { display: flex; flex-direction: column; }
      #screens { flex: 1; grid-template-columns: minmax(0, 1fr); }
      .screen { padding: 10px; gap: 8px; }
      #tiles { flex: none; flex-direction: row; overflow-x: auto; overflow-y: hidden; gap: 10px; }
      .tile { flex: 1 0 96px; min-height: 0; height: 96px; gap: 4px; }
      .tile .avatar { width: 40px; height: 40px; font-size: 13px; }
      .tile strong { font-size: 12px; font-weight: 400; }
      .controls { height: 88px; padding: 12px; border-radius: 20px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
      #chat-toggle { display: inline-flex; }
      /* Mobile: the chat opens full screen over the call. */
      body.chat-open .side { display: flex; position: fixed; inset: 0; z-index: 5; width: auto; padding: 12px; background: var(--bg); }
      body.chat-open .side .room, body.chat-open .side .me { display: none; }
      #chat-close { display: inline-flex; }
      .controls .btn { height: 100%; padding: 0 8px; font-size: 13px; }
      .toast { bottom: 112px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <section class="room card" aria-labelledby="room-title">
        <div class="row">
          <span class="eyebrow">Sala</span>
          <span class="end online" id="online"></span>
        </div>
        <h1 id="room-title"></h1>
        <ul id="people" aria-label="Quem está na sala"></ul>
        <button class="btn small" id="copy-side">Copiar convite</button>
      </section>

      <section class="chat card" aria-labelledby="chat-title">
        <div class="row">
          <span class="eyebrow" id="chat-title">Chat</span>
          <button class="btn small end" id="chat-close">Fechar</button>
        </div>
        <ol id="messages" aria-live="polite"></ol>
        <form class="chat-form" id="chat-form">
          <input id="chat-input" maxlength="500" placeholder="Mensagem" autocomplete="off" aria-label="Mensagem para a sala" disabled>
          <button class="btn small primary" id="chat-send" disabled>Enviar</button>
        </form>
      </section>

      <section class="me card row" aria-label="Seu perfil">
        <div class="avatar" id="me-avatar" aria-hidden="true"></div>
        <div class="me-text">
          <strong class="ellipsis" id="me-nick"></strong>
          <span id="me-status"></span>
        </div>
        <button class="btn small end" id="edit">Editar</button>
      </section>
    </aside>

    <main class="stage">
      <header class="topbar card">
        <div class="logo" aria-hidden="true">FC</div>
        <h2 id="room-tag"></h2>
        <span class="muted" id="timer">00:00:00</span>
        <span class="topbar-end">
          <span class="pill reconnecting" id="reconnecting" role="status" hidden>Reconectando…</span>
          <span class="pill" id="live" hidden>● Ao vivo</span>
        </span>
      </header>

      <div class="content">
        <section id="screens" aria-label="Telas compartilhadas">
          <div class="screen card" id="empty">
            <div class="frame">
              <strong>Ninguém está compartilhando</strong>
              <span id="empty-hint">Clique em "Compartilhar tela" para mostrar a sua. Duplo clique numa tela abre em tela cheia.</span>
            </div>
          </div>
        </section>
        <section id="tiles" aria-label="Participantes"></section>
      </div>

      <footer class="controls card">
        <button class="btn primary" id="share" disabled>
          <span class="long" id="share-long">Compartilhar tela</span><span class="short" id="share-short">Tela</span>
        </button>
        <div class="mode" role="group" aria-label="Qualidade ao compartilhar">
          <button class="mode-btn" id="mode-jogo" aria-pressed="true" title="Fluido e leve para o PC: até 720p a 30 FPS">Jogo</button>
          <button class="mode-btn" id="mode-texto" aria-pressed="false" title="Nítido para código e documentos: até 1080p a 15 FPS">Texto</button>
        </div>
        <button class="btn" id="copy"><span class="long">Copiar link</span><span class="short">Link</span></button>
        <button class="btn" id="chat-toggle">Chat<span class="badge" id="chat-badge" hidden></span></button>
        <button class="btn danger" id="leave">Sair</button>
      </footer>
    </main>
  </div>

  <dialog id="profile" aria-labelledby="profile-title">
    <form id="profile-form">
      <div class="banner"></div>
      <div class="dialog-body">
        <div class="avatar-row">
          <div class="avatar big" id="preview-avatar" aria-hidden="true"></div>
          <button type="button" class="btn small" id="photo-pick">Alterar foto</button>
          <button type="button" class="btn small" id="photo-remove">Remover</button>
          <input type="file" id="photo-input" accept="image/*" hidden>
        </div>
        <div class="heading">
          <h2 id="profile-title">Como seus amigos vão te ver?</h2>
          <span class="muted">Nick e foto aparecem só para quem está na sala.</span>
        </div>
        <label class="field">
          <span class="muted">Nick</span>
          <input id="nick-input" maxlength="32" autocomplete="nickname" required>
        </label>
        <button class="btn small primary" id="profile-submit">Entrar na sala</button>
      </div>
    </form>
  </dialog>

  <dialog id="notice" aria-labelledby="notice-title">
    <div class="dialog-body">
      <h2 id="notice-title"></h2>
      <p class="muted" id="notice-text"></p>
      <div class="actions">
        <button class="btn small primary" id="notice-retry">Entrar de novo</button>
        <a class="btn small" href="/">Nova sala</a>
      </div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="/room.js"></script>
</body>
</html>
